name: Terraform PR Check

# Re-runs the plan on every PR into main, and posts/updates a table as a PR
# comment so reviewers can double-check what will change before merge.
on:
  pull_request:
    branches:
      - main   # change to your default branch if it's not "main"

permissions:
  id-token: write
  contents: read
  pull-requests: write   # needed to post/update the PR comment

env:
  TF_WORKING_DIR: .

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan -no-color

      - name: Convert plan to JSON
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -json tfplan > plan.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render plan as a table
        id: table
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/tf_plan_table.py" plan.json \
            "Terraform Plan for PR #${{ github.event.pull_request.number }}" > plan_table.md
          echo "table_path=${{ env.TF_WORKING_DIR }}/plan_table.md" >> "$GITHUB_OUTPUT"

      - name: Post/update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('${{ steps.table.outputs.table_path }}', 'utf8');
            const marker = '<!-- terraform-plan-comment -->';
            const commentBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }