name: Bootstrap Terraform Backend

# Manual only — this creates the S3 bucket + DynamoDB table that every
# other workflow's `backend "s3"` block depends on. Run once, from the
# Actions tab. Safe to re-run (idempotent) but doesn't need to run
# automatically on every push.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: eu-west-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boto3
        run: pip install boto3

      - name: Bootstrap Terraform backend
        run: |
          python3 scripts/bootstrap-backend.py \
          --bucket-prefix gbt-infra-terraform-state \
          --region eu-west-1